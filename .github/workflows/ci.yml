name: CI

# main 푸시 + PR 시 자동 검증. 빌드(타입체크+컴파일+CSS 파싱)가 핵심 게이트 —
# 오늘 같은 빌드/타입/CSS 에러를 머지 전에 자동 차단한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 빌드는 실제 DB에 접속하지 않는다. db.ts 의 top-level 가드(키 존재 검사)를
      # 통과시키기 위한 더미값. (env.ts 는 누락에 throw 하지 않으므로 그 외는 불필요)
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-ci-build-only
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build-only
      # OpenAI/Anthropic 클라이언트가 일부 API 라우트 module-load 시점에 생성되어
      # 빌드 시 page-data 수집 중 키를 요구한다(실호출 X). 가드 통과용 더미.
      OPENAI_API_KEY: sk-dummy-ci-build-only
      ANTHROPIC_API_KEY: sk-ant-dummy-ci-build-only
      # sessionSecret 가 프로덕션(NODE_ENV=production) 빌드에서 AUTH_SECRET 미설정 시 throw(fail-closed).
      # 빌드 통과용 더미(실서명 X — 런타임 Vercel엔 실제 값 설정됨).
      AUTH_SECRET: dummy-auth-secret-for-ci-build-only
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 핵심 게이트: 타입체크 + 컴파일 + CSS 파싱 (실패 시 머지 차단)
      - name: Build
        run: npm run build

      # 참고용(비차단): 기존 lint 부채가 많아 우선 리포트만. 점진적으로 0 만든 뒤 차단 전환.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
